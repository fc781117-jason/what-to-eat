name: Verify Vercel Preview

on:
  push:
    branches:
      - feature/v1-personalized-onboarding-themes
      - feature/v2-functional-ux
  workflow_dispatch:

concurrency:
  group: what-to-eat-vercel-preview
  cancel-in-progress: true

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Functional tests
        run: npm test

      - name: Build Vercel-compatible app
        run: npm run build
